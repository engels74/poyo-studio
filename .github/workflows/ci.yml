name: ci
'on':
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number for a repair dispatch
        type: string
        default: ''
      expected-head-sha:
        description: Exact repaired PR commit
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/dispatch-guard@v1.0.0
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
  quality:
    needs: guard
    uses: edbfi/automation/.github/workflows/bun.yml@v1.0.0
    with:
      # renovate: datasource=npm depName=bun
      version: 1.4.2
      command: bun run format:check && bun run lint && bun run check
  unit:
    needs: guard
    uses: edbfi/automation/.github/workflows/bun.yml@v1.0.0
    with:
      # renovate: datasource=npm depName=bun
      version: 1.4.2
      command: bun run test:ci
  browser:
    name: Production browser and security checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.2-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser:ci
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Reject tracked-file mutation
        run: git diff --exit-code HEAD
    needs: guard
    timeout-minutes: 30
    env:
      CI: 'true'
  media:
    needs: guard
    uses: edbfi/automation/.github/workflows/bun.yml@v1.0.0
    with:
      # renovate: datasource=npm depName=bun
      version: 1.4.2
      runner: macos-15
      timeout-minutes: 30
      command: |-
        brew bundle --file=.github/Brewfile
        bun run test:media-tools:ci
  hygiene:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: j178/prek-action@v3.0.0
        with:
        # renovate: datasource=github-releases depName=j178/prek
          prek-version: 0.5.2
          extra-args: --all-files --hook-stage manual
        env:
          SKIP: no-commit-to-branch,bun-format-check,bun-lint,svelte-check,bun-test,registry-validate,bun-build
      - run: git diff --exit-code HEAD
  required:
    name: ci / required
    if: always()
    needs:
      - guard
      - quality
      - unit
      - browser
      - media
      - hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/dispatch-guard@v1.0.0
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
      - uses: edbfi/automation/actions/gate@v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
          required: guard quality unit browser media hygiene
